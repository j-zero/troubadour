# mt32-pi.cfg: mt32-pi configuration file.
# Default options are marked with an asterisk (*).
#
# Configured for: Raspberry Pi Zero 2 W, I2S DAC, round GC9A01 SPI display,
# two rotary encoders (simple_encoder scheme).
#
# Wiring (BCM GPIO numbers, header pin in brackets):
#   I2S DAC:          BCK 18 (12), LRCK 19 (35), DATA 21 (40)
#   GC9A01 display:   SCL/SCK 11 (23), SDA/DIN 10 (19), CS 8 (24), DC 25 (22),
#                     RST 5 (29), BL 6 (31), VCC 3.3V (1 or 17), GND
#   Encoder 1:        CLK 22 (15), DAT 23 (16), button 4 (7)
#   Encoder 2:        CLK 12 (32), DAT 16 (36), button 26 (37)
#   Buttons 1/2:      17 (11), 27 (13), if connected
#
# Settings changed with the encoders (SoundFont, instrument, volume, reverb and
# chorus) are saved to last_state.cfg and take precedence over this file.
# Delete last_state.cfg to start with the settings from this file again.
#
# Presets (Settings > Preset) are stored in the presets folder on the SD card,
# one file per preset (preset01.cfg, ...; ordered by file name). Each one holds
# the instrument (SoundFont, bank, program), the reverb and chorus settings and
# the TriplePlay's transpose, bend mode and range, channel mode and string
# sensitivities. There is always a current preset (the first one is made from
# the instrument on startup); changes to these settings are saved to it
# automatically (about two seconds after the last change). The instruments of
# all presets (from the current SoundFont) are kept in memory as far as they
# fit, so that switching presets doesn't load samples; loading them makes
# startup take longer.

# -----------------------------------------------------------------------------
# System options
# -----------------------------------------------------------------------------
[system]

# Enable or disable verbose startup and error output.
#
# When enabled, MIDI/UART errors are shown on the display.
#
# Values: on, off*
verbose = off

# Enable or disable support for USB devices.
#
# Disable this to speed up boot time if you are not using any USB devices
# (e.g. a USB MIDI interface).
#
# Values: on*, off
usb = on

# Set the I2C baud rate/clock speed for all peripherals (Hz).
#
# Used for detecting I2S DACs. The display uses SPI and isn't affected by this
# setting.
#
# Values: 100000-1000000 (400000*)
i2c_baud_rate = 400000

# Set the timeout for power saving mode (seconds).
#
# After the specified number of seconds of silence, the CPU clock speed will be
# reduced, the audio device will be stopped, and the display will be turned off
# to save energy.
#
# Any MIDI activity or using the controls will instantly bring the system out
# of power saving mode.
#
# If set to 0, power saving mode is disabled.
#
# Values: 0-3600 (300*)
power_save_timeout = 300

# -----------------------------------------------------------------------------
# MIDI options
# -----------------------------------------------------------------------------
[midi]

# Set the baud rate used for GPIO MIDI.
#
# For connecting to standard MIDI devices (i.e. via DIN cable), this should be
# left at the default rate of 31250.
#
# Values: 300-4000000 (31250*)
gpio_baud_rate = 31250

# Enable or disable software "MIDI thru" on the GPIO Tx pin.
#
# When enabled, all data received via the GPIO Rx pin will be re-transmitted
# verbatim on the Tx pin.
#
# Values: on, off*
gpio_thru = off

# Set the baud rate used for USB serial MIDI.
#
# Values: 9600-115200 (38400*)
usb_serial_baud_rate = 38400

# -----------------------------------------------------------------------------
# Audio options
# -----------------------------------------------------------------------------
[audio]

# Select audio output device.
#
# Values: pwm*, hdmi, i2s
#
# pwm:  Use the headphone jack (or GPIO 12/13 on the Pi Zero 2 W)
# hdmi: Use the HDMI port
# i2s:  Use an I2S DAC
output_device = i2s

# Sample rate of audio output (Hz).
#
# FluidSynth renders at this sample rate directly.
#
# Values: 32000-192000 (48000*)
sample_rate = 48000

# Set audio rendering chunk size (samples).
#
# A single stereo frame of audio has two samples, and so this value is double
# the number of frames per chunk. The smaller the chunk size, the lower the
# latency, but too low a value will cause underruns (distortion artifacts).
#
# Latency is a function of chunk size and sample rate, for example:
# 256 samples / 2 channels / 48000Hz * 1000ms = 2.67ms of latency.
#
# For I2S, the minimum is 32.
#
# Values: 2-2048 (256*)
chunk_size = 256

# Set whether the stereo channels should be swapped or not.
#
# Use this option to work around wrongly-wired audio hardware.
#
# Values: on, off*
reversed_stereo = off

# -----------------------------------------------------------------------------
# Control options
# -----------------------------------------------------------------------------
[control]

# Set the physical control scheme.
#
# Values: none*, simple_buttons, simple_encoder
#
# none:           No physical controls
# simple_buttons: 4 buttons on GPIO 17, 27, 22 and 23. Buttons 1 and 2 work
#                 like the footswitches below, buttons 3 and 4 change the
#                 volume
# simple_encoder: 2 buttons/footswitches (GPIO 17 and 27) + 2 rotary encoders.
#                 Footswitches: each one switches to the next (button 1,
#                 GPIO 17) or previous (button 2, GPIO 27) preset when
#                 released.
#                 A button whose pin is used by encoder 2 is ignored.
#                 Encoder 1: turning opens the list of the SoundFont's
#                 instruments, pressing it selects the highlighted one for
#                 MIDI channels 1-6.
#                 Encoder 2: pressing it opens the settings:
#                   Preset: select a preset; what the current preset holds:
#                     SoundFont, instrument (from a list); Effects: reverb
#                     (level, room size, damping, width), chorus (level,
#                     depth, speed, voices); TriplePlay: octave, semitones,
#                     bend mode and range, channel mode, string
#                     sensitivities; add the current settings as a new
#                     preset, delete the current one (not the last one)
#                   Global: volume, drum kit (MIDI channel 10), channels
#                     shown on the home screen (1-16), display standby;
#                     TriplePlay: on/off, software mode, program change,
#                     button assignments, hand position, open strings,
#                     battery
#                 Turning either encoder selects an item and pressing encoder 2
#                 opens it (a submenu, or a setting whose value encoder 2 then
#                 changes; for the drum kit/SoundFont, a list). Pressing
#                 encoder 2 again goes back to the list (loading the
#                 highlighted drum kit/SoundFont); "Back" leaves a submenu.
#                 Holding encoder 2, pressing encoder 1 or selecting "Exit"
#                 leaves the settings. Turning encoder 2 outside of the menus
#                 changes the volume.
#                 A level of 0 turns reverb/chorus off. Menus close after 8s.
scheme = simple_encoder

# Set the rotary encoder type (both encoders).
#
# Different rotary encoders may complete different fractions of a Gray-code
# cycle per detent ("click").
#
# If four clicks are needed for a single movement, try "quarter".
# If two clicks are needed for a single movement, try "half".
#
# Values: quarter, half, full*
encoder_type = full

# Reverse the direction of encoder 1 (GPIO 22/23) if it turns the wrong way.
#
# Values: on, off*
encoder_reversed = off

# GPIO pins (BCM numbering) of encoder 2. Avoid the pins of I2S (18, 19, 20,
# 21), I2C (2, 3), the serial port (14, 15), SPI (7-11), the display's DC,
# RST and BL pins (25, 5, 6), and GPIO 12/13 when using PWM audio.
#
# Values: 0-27 (12*, 16*, 26*)
encoder2_clk_pin = 16
encoder2_dat_pin = 12
encoder2_button_pin = 26

# Reverse the direction of encoder 2 (or swap its CLK and DAT pins above) if it
# turns the wrong way.
#
# Values: on, off*
encoder2_reversed = off

# Enable or disable the I2C MiSTer control interface.
#
# Values: on, off*
mister = off

# Set the delay before loading a SoundFont selected via the MiSTer interface
# (seconds). SoundFonts selected with encoder 2 are loaded immediately.
#
# Values: 0-3600 (3*)
switch_timeout = 3

# -----------------------------------------------------------------------------
# Fishman TriplePlay options
# -----------------------------------------------------------------------------
[tripleplay]

# Both options can also be switched in the settings (Global > TriplePlay); that
# is saved to last_state.cfg and takes precedence. There, the button assignments
# can also be changed (stored in the TriplePlay).
#
# The settings that the TriplePlay has per patch (bend mode and range, channel
# mode), the transpose and the string sensitivities can be changed in
# Instrument > TriplePlay. The transpose (octaves and semitones, up to 3
# octaves and 11 semitones either way) is performed by Troubadour on the
# guitar's notes; the TriplePlay's own transpose is kept at zero. The transpose
# and bend mode are part of the presets (see above).

# Talk to a TriplePlay (Express) receiver connected to USB: the transpose (in
# octaves) and bend mode are shown on the home screen, and its settings can be
# changed in the settings. Its settings messages are taken from the receiver;
# its second MIDI port then no longer goes to the synth.
#
# Values: on, off*
enabled = on

# Software mode: the TriplePlay only reports its Up/Down buttons, and Troubadour
# performs the actions assigned to them in the TriplePlay utility (program,
# transpose, bend mode, etc.).
#
# Values: on*, off
software_mode = on

# The TriplePlay's program changes (e.g. from its patch selection, or its
# buttons' program up/down in software mode) select presets instead of the
# synth's instrument: program 1 selects P1, and so on. Without presets, they
# select the instrument as before. Also switched in Settings > Global >
# TriplePlay > Program change, which is saved to last_state.cfg.
#
# Values: on*, off
program_change_presets = on

# -----------------------------------------------------------------------------
# SoundFont synthesizer options
# -----------------------------------------------------------------------------
[fluidsynth]

# Set the initial SoundFont to use.
#
# On startup, the "soundfonts" directory is scanned for valid SoundFonts, which
# are sorted into alphabetical order. This setting is a zero-indexed offset
# into that list (0 is the first, 1 the second, and so on). If the index is
# unavailable, the first SoundFont is used.
#
# A SoundFont selected with encoder 2 is saved to last_state.cfg and takes
# precedence over this setting.
#
# Values: 0-255 (0*)
soundfont = 0

# Set the maximum number of voices that can be played simultaneously.
#
# Reduce this value if you hear distortion when lots of notes are played at
# once.
#
# Values: 1-65535 (200*)
polyphony = 200

# Load sample data from the SD card on demand.
#
# When enabled, only the samples of the instruments currently selected on the
# 16 MIDI channels are kept in memory, which allows the use of SoundFonts that
# are larger than the amount of RAM available (up to the 4GB file size limit of
# FAT32). Notes will be delayed while an instrument is loading samples.
#
# Instruments that don't fit into memory on their own (about 440MB on the Pi
# Zero 2 W) can't be used; "Out of memory!" is shown instead.
#
# When disabled, the whole SoundFont is loaded into memory in advance, which
# must then fit into RAM.
#
# Values: on*, off
dynamic_samples = on

# The following settings set the default parameters for FluidSynth's master
# volume gain, reverb and chorus effects.
#
# Each setting can be overridden on a per-SoundFont basis by creating a .cfg
# file adjacent to the SoundFont file with the same name (e.g. "foo.cfg" for
# "foo.sf2"). Reverb and chorus settings changed with encoder 2 take precedence
# over both.
#
# Full descriptions and valid value ranges for each setting can be found in the
# FluidSynth documentation: https://www.fluidsynth.org/api/fluidsettings.xml
gain = 0.2

reverb = on
reverb_damping = 0.0
reverb_level = 0.9
reverb_room_size = 0.2
reverb_width = 0.5

chorus = on
chorus_depth = 8.0
chorus_level = 2.0
chorus_voices = 3
chorus_speed = 0.3

# -----------------------------------------------------------------------------
# Display options
# -----------------------------------------------------------------------------
[lcd]

# Select the display.
#
# Values: none*, gc9a01_spi
#
# none:       No display
# gc9a01_spi: Round 240x240 colour SPI TFT display (usually 1.28")
type = gc9a01_spi

# Rotate the display output, e.g. to match how the display is mounted.
#
# Values: normal*, 90, inverted, 270
#
# normal:   No rotation
# 90:       Rotated by 90 degrees
# inverted: The display output is upside down
# 270:      Rotated by 90 degrees the other way
rotation = 270

# Mirror the display output horizontally.
#
# Values: normal*, mirrored
#
# normal:   No mirroring
# mirrored: The display output is mirrored horizontally
mirror = normal

# GPIO pins (BCM numbering) of SPI displays (gc9a01_spi only) for the data/
# command (DC), reset (RST) and backlight (BL) signals. SCL/SCK, SDA/DIN and CS
# are fixed to GPIO 11, 10 and 8 (SPI0). BL may also be connected to 3.3V.
#
# Values: 0-27 (25*, 5*, 6*)
spi_dc_pin = 25
spi_reset_pin = 5
spi_backlight_pin = 6

# SPI clock speed of SPI displays (Hz). The actual speed is the next lower one
# the Pi supports (250MHz divided by an even number, e.g. 15.6MHz for the
# default). Lower it, e.g. to 4000000, if the display stays black or shows
# garbage; long jumper wires may need a lower speed.
#
# Values: 1000000-62500000 (16000000*)
spi_clock_speed = 16000000

# Turn the display off after this many seconds without activity (MIDI, the
# encoders, the buttons or the TriplePlay); any activity turns it on again.
# Only the display is turned off: sound keeps playing. Also set in Settings >
# Global > Display standby, which is saved to last_state.cfg and takes
# precedence over this setting. power_save_timeout in [system] also turns the
# display off.
#
# Values: 0 (never)*, 1-3600
standby_timeout = 0

# -----------------------------------------------------------------------------
# Network options
# -----------------------------------------------------------------------------
[network]

# Select the network mode.
#
# For setting your Wi-Fi SSID and encryption key, see wpa_supplicant.conf.
# Wi-Fi doesn't work on the Raspberry Pi 3 and Zero 2 W: the SD card is
# accessed through the controller that Wi-Fi would need (see NO_SDHOST in the
# Makefile), as the other one interrupts the sound.
#
# Values: off*, ethernet, wifi
mode = off

# Enable or disable DHCP for configuring the network.
#
# Values: on*, off
dhcp = on

# Manual settings for configuring the network interface (used if DHCP is off).
ip_address = 192.168.1.100
subnet_mask = 255.255.255.0
default_gateway = 192.168.1.1
dns_server = 192.168.1.1

# Set the network hostname.
#
# Values: ASCII letters 'a' to 'z', digits 0-9, and hyphens (troubadour*)
hostname = troubadour

# Enable or disable the RTP-MIDI/AppleMIDI server.
#
# Values: on*, off
rtp_midi = on

# Enable or disable the UDP MIDI server (port 1999).
#
# Values: on*, off
udp_midi = on

# Enable or disable the embedded FTP server.
#
# This FTP server DOES NOT feature any kind of encryption. Do not enable it on a
# public network.
#
# Values: on, off*
ftp = off

# Set the FTP server username and password.
#
# Values: any ASCII string (mt32-pi*)
ftp_username = mt32-pi
ftp_password = mt32-pi
